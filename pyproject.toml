[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "aether-studio"
version = "1.0.0"
description = "Free, self-hosted app development studio. Build apps, SDKs, and fix projects automatically."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "iHub", email = "ihub.mob.app@gmail.com"}]
keywords = ["ide", "studio", "app-builder", "code-generator", "aether", "ihub"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

[project.scripts]
aether-studio = "aether_studio.__main__:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["static/**/*", "locales/*.json", "gateway/*.py", "studio_core/*.py", "modules/**/*.py"]
